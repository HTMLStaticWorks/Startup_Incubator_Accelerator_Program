<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ventro | Founder Portal Login</title>
  <meta name="description" content="Log in to the Ventro founder portal to track your cohort milestones, mentor sessions and funding progress.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;450;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="auth-page">

  <div class="auth-actions">
    <button class="theme-toggle" aria-label="Toggle theme"><i class="ph ph-moon"></i></button>
    <button class="rtl-toggle" aria-label="Toggle RTL"><i class="ph ph-arrows-left-right"></i></button>
  </div>

  <div class="auth-card">
    <a href="index.html" class="auth-brand">
      <i class="ph-fill ph-rocket-launch"></i> Ventro
    </a>

    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Log in to manage your cohort and milestones</p>

    <form data-validate="true" action="dashboard.html">
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input type="email" id="email" class="form-control" name="email" required placeholder="founder@startup.com" autocomplete="email">
        <div class="error-message"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="password-field">
          <input type="password" id="password" class="form-control" name="password" required placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="password-toggle" aria-label="Show password">
            <i class="ph ph-eye"></i>
          </button>
        </div>
        <div class="error-message"></div>
      </div>

      <div class="auth-row">
        <label class="checkbox-group">
          <input type="checkbox" name="remember">
          <span>Remember me</span>
        </label>
        <a href="#" class="auth-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg">Log in to dashboard</button>
    </form>

    <div class="auth-divider">or</div>

    <div class="social-login">
      <button type="button" class="btn btn-social btn-full">
        <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </button>
      <button type="button" class="btn btn-social btn-full">
        <i class="ph-fill ph-apple-logo"></i> Continue with Apple
      </button>
    </div>

    <p class="auth-foot">
      Don't have an account? <a href="register.html">Register here</a>
    </p>

    <p style="text-align: center; margin: 0;">
      <a href="index.html" class="auth-back"><i class="ph ph-arrow-left"></i> Back to site</a>
    </p>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
